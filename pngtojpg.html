<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Image to JPG Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/tiff.js@1.0.0/tiff.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .drop-zone {
            border: 2px dashed #4a90e2;
            padding: 30px;
            border-radius: 8px;
            background: #f9fbfd;
            cursor: pointer;
            transition: background 0.3s;
        }
        .drop-zone:hover { background: #f0f6ff; }
        input[type="file"] { display: none; }
        .icon { font-size: 40px; color: #4a90e2; margin-bottom: 10px; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 20px;
            border-radius: 6px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .download-btn {
            display: none;
            margin: 20px auto 0;
            padding: 12px 24px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }
        .download-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image to JPG Converter</h2>
    <p>Convert PNG, JFIF, or TIFF to high-quality JPG</p>
    
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📁</div>
        <span>Click or Drag & Drop your image here</span>
        <input type="file" id="fileInput" accept=".png, .jfif, .jpg, .jpeg, .tiff, .tif">
    </div>

    <div id="status"></div>
    <img id="preview" alt="Converted preview">
    <a id="downloadBtn" class="download-btn">Download Lossless JPG</a>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');

    fileInput.addEventListener('change', handleFile);

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        status.textContent = "Processing image...";
        preview.style.display = 'none';
        downloadBtn.style.display = 'none';

        const fileExtension = file.name.split('.').pop().toLowerCase();

        // Handle TIFF files specifically using tiff.js
        if (fileExtension === 'tiff' || fileExtension === 'tif') {
            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const tiff = new Tiff({ buffer: event.target.result });
                    const canvas = tiff.toCanvas();
                    if (canvas) {
                        processCanvas(canvas, file.name);
                    } else {
                        throw new Error("Could not parse TIFF data.");
                    }
                } catch (err) {
                    status.textContent = "Error processing TIFF file.";
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        } else {
            // Handle PNG, JFIF, and standard images natively
            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Fill white background (JPEGs don't support transparency, turns black otherwise)
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.drawImage(img, 0, 0);
                    processCanvas(canvas, file.name);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function processCanvas(canvas, originalName) {
        // 'image/jpeg' with quality 1.0 enforces maximum quality export
        const jpgDataUrl = canvas.toDataURL('image/jpeg', 1.0);
        
        // Update Preview
        preview.src = jpgDataUrl;
        preview.style.display = 'block';
        
        // Setup Download Button
        const baseName = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
        downloadBtn.href = jpgDataUrl;
        downloadBtn.download = `${baseName}_converted.jpg`;
        downloadBtn.style.display = 'inline-block';
        
        status.textContent = "Conversion Complete!";
    }

    // Drag and drop logic
    const dropZone = document.querySelector('.drop-zone');
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.style.background = '#f0f6ff'; }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.style.background = '#f9fbfd'; }, false);
    });
    dropZone.addEventListener('drop', (e) => {
        fileInput.files = e.dataTransfer.files;
        handleFile({ target: fileInput });
    });
</script>

</body>
</html>
